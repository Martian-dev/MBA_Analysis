[project]
name = "mba-product-skeleton"
version = "0.1.0"
description = "Market Basket Analysis Capstone with Flask and FP-Growth"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "pandas>=2.1.0",
    "mlxtend>=0.23.0",
    "scikit-learn>=1.3.0",
    "jupyter>=1.0.0",
    "nltk>=3.8.1",
    "kafka-python>=2.2.15",
    "redis>=5.2.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.25.0",
    "pytest>=8.0.0",
]
semantic = [
    "sentence-transformers>=6.1.0",
    "torch>=2.6.0,<2.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
