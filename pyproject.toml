[project]
name = "mba-product-skeleton"
version = "0.1.0"
description = "Market Basket Analysis Capstone with Flask and FP-Growth"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "pandas>=2.1.0",
    "mlxtend>=0.23.0",
    "scikit-learn>=1.3.0",
    "jupyter>=1.0.0",
    "nltk>=3.8.1"
]

[dependency-groups]
dev = [
    "ipykernel>=6.25.0",
]