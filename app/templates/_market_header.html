<a class="skip-link" href="#main-content">Skip to shopping</a>
<header class="market-header" data-catalog-scope="{{ catalog_scope_token }}" data-shopper-id="{{ shopper_id }}" data-csrf-token="{{ csrf_token }}" data-dwell-threshold="{{ dwell_threshold_seconds }}">
    <div class="market-header__inner">
        <a class="brand" href="/" aria-label="Basket Signal market home">
            <svg class="brand__mark" viewBox="0 0 48 48" aria-hidden="true"><path d="M10 20h28l-3 20H13z"/><path d="M17 21c0-8 3-13 7-13s7 5 7 13"/><path d="M19 13c-3-5-7-6-10-5 1 4 4 7 10 7"/></svg>
            <span><strong>Basket Signal</strong><small>neighbourhood market</small></span>
        </a>
        <form class="header-search" action="/" role="search">
            <label class="sr-only" for="header-search">Search the grocery market</label>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg>
            <input id="header-search" name="q" type="search" placeholder="Search analyzed groceries" autocomplete="off">
        </form>
        <nav class="market-nav" aria-label="Store navigation">
            <a href="/rules" class="market-nav__rules"{% if request.path == '/rules' %} aria-current="page"{% endif %}>Rules</a>
            <a href="/viewer" class="market-nav__signal"><span class="live-dot" aria-hidden="true"></span><span>Signal Room</span></a>
            <button class="basket-button" type="button" data-open-cart aria-controls="cart-drawer" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h2l2.3 10.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
                <span>Basket</span><strong data-cart-count>0</strong>
            </button>
        </nav>
    </div>
</header>
